# This is a basic workflow to help you get started with Actions

name: R Conda

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'
      - uses: actions/checkout@v6
      - run: git lfs pull
      - name: Create conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: recetox-aplcms
          auto-update-conda: true
          environment-file: conda/environment.yaml
          auto-activate: false
      - run: |
          conda init bash
          conda env list
          conda list
      - name: Install ThermoRawFileReaderDLLs
        run: |
          conda activate recetox-aplcms
          Rscript -e "rawrr::installRawFileReaderDLLs()" -e "rawrr::installRawrrExe()"
      - name: Test coverage
        run: |
          conda activate recetox-aplcms
          Rscript -e "covr::codecov(quiet = FALSE)"
